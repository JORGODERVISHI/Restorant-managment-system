<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant - Login</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #999;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background-color: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid #c33;
    }

    .error-message.show {
      display: block;
      animation: shake 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .success-message {
      background-color: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid #3c3;
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: #667eea;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #667eea;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .demo-credentials {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }

    .demo-credentials strong {
      color: #333;
    }

    .demo-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
    }

    .demo-role {
      color: #667eea;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Restaurant_JORGOS</h1>
      <p>Management System Login</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Enter your username"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login-button" id="loginBtn">
        Login
      </button>

      <div class="loading" id="loadingSpinner">
        <span class="spinner"></span>
        <span>Logging in...</span>
      </div>
    </form>

    <div class="demo-credentials">
      <strong>Demo Credentials:</strong>
      <div class="demo-row">
        <span><strong>Admin:</strong> admin / admin123</span>
      </div>
    
  </div>

  <script>
   const loginForm = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorMessage = document.getElementById('errorMessage');
const successMessage = document.getElementById('successMessage');
const loadingSpinner = document.getElementById('loadingSpinner');

// ═══════════════════════════════════════════════════════════
// 🔀 RIDREJTIMI I ZGJUAR - kthehu te faqja që përdoruesi donte
// të hapte fillimisht (nëse ekziston dhe roli përputhet),
// përndryshe shko te faqja e paracaktuar për rolin e tij
// ═══════════════════════════════════════════════════════════
const ROLE_DEFAULT_PAGE = {
  admin: '/public/admin.html',
  waiter: '/public/waiter.html',
  kitchen: '/public/kitchen.html',
  bar: '/public/bar.html'
};

const PAGE_ROLES = {
  'admin.html': 'admin',
  'waiter.html': 'waiter',
  'kitchen.html': 'kitchen',
  'bar.html': 'bar'
};

function getRedirectUrl(user) {
  const intended = sessionStorage.getItem('redirectAfterLogin');
  sessionStorage.removeItem('redirectAfterLogin');

  if (intended) {
    const pageName = intended.split('/').pop();
    const requiredRole = PAGE_ROLES[pageName];
    // Ridrejto te faqja e synuar vetëm nëse roli i përdoruesit përputhet
    if (!requiredRole || requiredRole === user.role) {
      return intended;
    }
  }

  return ROLE_DEFAULT_PAGE[user.role] || '/public/kiosk.html';
}

// ═══════════════════════════════════════════════════════════
// FORM SUBMISSION
// ═══════════════════════════════════════════════════════════

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const username = usernameInput.value.trim();
  const password = passwordInput.value.trim();

  // Validation
  if (!username || !password) {
    showError('❌ Please fill in all fields');
    return;
  }

  if (username.length < 3) {
    showError('❌ Username must be at least 3 characters');
    return;
  }

  if (password.length < 6) {
    showError('❌ Password must be at least 6 characters');
    return;
  }

  // Attempt login
  await login(username, password);
});

// ═══════════════════════════════════════════════════════════
// LOGIN FUNCTION
// ═══════════════════════════════════════════════════════════

async function login(username, password) {
  try {
    // Show loading
    setLoading(true);
    clearMessages();

    console.log('🔄 Attempting login...');
    console.log('Username:', username);

    // Send login request
    const response = await axios.post(
      'http://localhost:3000/auth/login',
      {
        username: username,
        password: password
      },
      {
        withCredentials: true  // ← Send cookies
      }
    );

    console.log('✅ Login successful!');
    console.log('Response:', response.data);

    // ═══════════════════════════════════════════════════════
    // ✅ NEW: SAVE USER INFO TO sessionStorage (i izoluar për çdo tab)
    // ═══════════════════════════════════════════════════════
    const user = response.data.user;
    sessionStorage.setItem('user', JSON.stringify(user));
    sessionStorage.setItem('isLoggedIn', 'true');
    sessionStorage.setItem('loginTime', new Date().toISOString());

    console.log('✅ User info saved to sessionStorage (per-tab)');
    console.log('User:', user);

    // Show success message
    showSuccess('✅ Login successful! Redirecting...');

    // ═══════════════════════════════════════════════════════
    // REDIRECT BASED ON ROLE
    // ═══════════════════════════════════════════════════════
    setTimeout(() => {
      const redirectUrl = getRedirectUrl(user);
      console.log('🚀 Redirecting to:', redirectUrl);
      window.location.href = redirectUrl;
    }, 1000);

  } catch (error) {
    console.error('❌ Login failed!');
    console.error('Error:', error);

    if (error.response) {
      console.error('Status:', error.response.status);
      console.error('Data:', error.response.data);
      
      const errorMsg = error.response.data?.error || 'Login failed';
      showError('❌ ' + errorMsg);
    } else if (error.request) {
      console.error('No response from server');
      showError('❌ No response from server. Is the server running?');
    } else {
      console.error('Error message:', error.message);
      showError('❌ ' + error.message);
    }

    // Clear password field on error
    passwordInput.value = '';
  } finally {
    setLoading(false);
  }
}

// ═══════════════════════════════════════════════════════════
// ERROR MESSAGE FUNCTION
// ═══════════════════════════════════════════════════════════

function showError(message) {
  console.error(message);
  errorMessage.textContent = message;
  errorMessage.style.display = 'block';
  errorMessage.style.background = '#fee';
  errorMessage.style.color = '#c33';
  errorMessage.style.padding = '10px';
  errorMessage.style.borderRadius = '5px';
  errorMessage.style.marginBottom = '20px';
  errorMessage.style.border = '1px solid #c33';
  successMessage.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// SUCCESS MESSAGE FUNCTION
// ═══════════════════════════════════════════════════════════

function showSuccess(message) {
  console.log(message);
  successMessage.textContent = message;
  successMessage.style.display = 'block';
  successMessage.style.background = '#efe';
  successMessage.style.color = '#3c3';
  successMessage.style.padding = '10px';
  successMessage.style.borderRadius = '5px';
  successMessage.style.marginBottom = '20px';
  successMessage.style.border = '1px solid #3c3';
  errorMessage.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// CLEAR MESSAGES
// ═══════════════════════════════════════════════════════════

function clearMessages() {
  errorMessage.style.display = 'none';
  successMessage.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// LOADING STATE
// ═══════════════════════════════════════════════════════════

function setLoading(isLoading) {
  if (isLoading) {
    loginBtn.disabled = true;
    loginBtn.textContent = '🔄 Logging in...';
    if (loadingSpinner) loadingSpinner.style.display = 'block';
  } else {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
    if (loadingSpinner) loadingSpinner.style.display = 'none';
  }
}

// ═══════════════════════════════════════════════════════════
// ENTER KEY SUPPORT
// ═══════════════════════════════════════════════════════════

usernameInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    passwordInput.focus();
  }
});

passwordInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    loginForm.dispatchEvent(new Event('submit'));
  }
});

// ═══════════════════════════════════════════════════════════
// CHECK IF ALREADY LOGGED IN
// ═══════════════════════════════════════════════════════════

window.addEventListener('load', () => {
  const isLoggedIn = sessionStorage.getItem('isLoggedIn');
  const user = JSON.parse(sessionStorage.getItem('user') || 'null');

  if (isLoggedIn && user) {
    console.log('✅ User already logged in:', user.name);
    console.log('Redirecting to dashboard...');
    window.location.href = getRedirectUrl(user);
  }
});

// ═══════════════════════════════════════════════════════════
// LOGOUT FUNCTION (for use in other pages)
// ═══════════════════════════════════════════════════════════

function logout() {
  console.log('🚪 Logging out...');
  
  // Clear sessionStorage (vetëm për këtë tab)
  sessionStorage.removeItem('user');
  sessionStorage.removeItem('isLoggedIn');
  sessionStorage.removeItem('loginTime');

  console.log('✅ Logged out successfully');

  // Redirect to login
  window.location.href = '/public/login.html';
}

// ═══════════════════════════════════════════════════════════
// EXPORT LOGOUT FOR OTHER PAGES
// ═══════════════════════════════════════════════════════════

window.logout = logout;

console.log('✅ login.js loaded');
  </script>
</body>
</html>
